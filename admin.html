<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Nebula</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #000; color: #fff; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; }
  #stars { position: fixed; inset: 0; z-index: 1; }
  .login-box { position: relative; z-index: 2; background: #111; padding: 30px; border-radius: 20px; width: 90%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
  .login-box h2 { margin-bottom: 20px; }
  input, select { width: 100%; padding: 12px; margin-bottom: 10px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #fff; outline: none; }
  select option { background: #111; color: #fff; }
  button { width: 100%; padding: 12px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  
  .admin-panel { display: none; position: relative; z-index: 2; width: 90%; max-width: 600px; background: #111; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; height: 80vh; flex-direction: column; }
  .tabs { display: flex; background: #000; border-bottom: 1px solid rgba(255,255,255,0.1); }
  .tab { flex: 1; padding: 15px; text-align: center; cursor: pointer; color: #888; font-size: 13px; transition: 0.2s; }
  .tab.active { color: #fff; border-bottom: 2px solid #fff; background: rgba(255,255,255,0.05); }
  .tab-content { padding: 20px; overflow-y: auto; flex: 1; }
  
  .section { display: none; }
  .section.active { display: block; }
  
  textarea { width: 100%; height: 80px; padding: 10px; background: rgba(255,255,255,0.1); border: none; border-radius: 8px; color: #fff; margin-bottom: 10px; outline: none; resize: none; }
  .msg-card { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
  .msg-user { font-weight: bold; color: #4da6ff; margin-bottom: 5px; }
  .msg-date { font-size: 12px; color: #888; float: right; }
  
  .admin-product { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid rgba(255,255,255,0.1); }
  .del-btn { width: auto; padding: 6px 12px; background: #ff4444; color: #fff; font-size: 12px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="login-box" id="loginBox">
  <h2>Вход в Админпанель</h2>
  <input type="text" id="loginUser" placeholder="Логин">
  <input type="password" id="loginPass" placeholder="Пароль">
  <button onclick="doLogin()">Войти</button>
</div>

<div class="admin-panel" id="adminPanel">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('control', this)">Рассылка</div>
    <div class="tab" onclick="switchTab('chats', this)">Чаты</div>
    <div class="tab" onclick="switchTab('add', this)">Добавить</div>
    <div class="tab" onclick="switchTab('products', this)">Товары</div>
  </div>
  
  <div class="tab-content">
    <div id="control" class="section active">
      <h3>Рассылка от бота</h3>
      <p style="color: #888; font-size: 12px; margin-bottom: 10px;">Сообщение получат все пользователи.</p>
      <textarea id="broadcastText" placeholder="Текст сообщения..."></textarea>
      <button onclick="sendBroadcast()">Отправить всем</button>
    </div>

    <div id="chats" class="section">
      <h3>Последние сообщения</h3>
      <div id="messagesList" style="margin-top: 15px;">Загрузка...</div>
    </div>

    <div id="add" class="section">
      <h3>Новый товар</h3>
      <input type="text" id="pName" placeholder="Название товара">
      <textarea id="pDesc" placeholder="Описание"></textarea>
      
      <select id="pCat">
        <option value="Telegram Stars">Telegram Stars</option>
        <option value="Steam">Steam аккаунты</option>
        <option value="Roblox">Roblox аккаунты</option>
        <option value="Telegram">Telegram аккаунты</option>
      </select>
      
      <input type="number" id="pPrice" placeholder="Цена в рублях">
      <input type="number" id="pStock" placeholder="Наличие (шт.)">
      <button onclick="addProduct()">Сохранить</button>
    </div>

    <div id="products" class="section">
      <h3>Список товаров</h3>
      <div id="productsListAdmin" style="margin-top: 15px;">Загрузка...</div>
    </div>
  </div>
</div>

<script>
  // НЕ ЗАБУДЬ СЮДА ВСТАВИТЬ ССЫЛКУ ОТ NGROK ЕСЛИ ТЕСТИШЬ С GITHUB
  const API_URL = "http://127.0.0.1:8000"; 
  let adminToken = "";

  async function doLogin() {
    const u = document.getElementById('loginUser').value;
    const p = document.getElementById('loginPass').value;
    try {
      const res = await fetch(`${API_URL}/api/admin/login`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username: u, password: p})
      });
      if (res.ok) {
        const data = await res.json();
        adminToken = data.token;
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'flex';
        loadMessages();
        loadProductsAdmin();
      } else { alert('Доступ запрещен!'); }
    } catch (e) { alert('Сервер недоступен. Убедись, что server.py запущен.'); }
  }

  function switchTab(id, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(id).classList.add('active');
  }

  async function sendBroadcast() {
    const text = document.getElementById('broadcastText').value;
    if (!text) return alert('Введите текст');
    const res = await fetch(`${API_URL}/api/admin/broadcast`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-token': adminToken},
      body: JSON.stringify({text})
    });
    if (res.ok) { alert('Успешно отправлено!'); document.getElementById('broadcastText').value = ''; }
  }

  async function addProduct() {
    const data = {
      name: document.getElementById('pName').value,
      description: document.getElementById('pDesc').value,
      category: document.getElementById('pCat').value,
      price: parseInt(document.getElementById('pPrice').value),
      stock: parseInt(document.getElementById('pStock').value)
    };
    
    const res = await fetch(`${API_URL}/api/admin/add_product`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json', 'x-token': adminToken},
      body: JSON.stringify(data)
    });
    if (res.ok) { 
      alert('Товар добавлен!'); 
      document.getElementById('pName').value = ''; 
      document.getElementById('pDesc').value = ''; 
      document.getElementById('pPrice').value = ''; 
      document.getElementById('pStock').value = '';
      loadProductsAdmin();
    }
  }

  async function loadProductsAdmin() {
    const res = await fetch(`${API_URL}/api/products`);
    const prods = await res.json();
    const list = document.getElementById('productsListAdmin');
    list.innerHTML = prods.map(p => `
      <div class="admin-product">
        <div><b>${p.name}</b> <br><span style="font-size:12px; color:#888;">${p.price} ₽ | ${p.category} | Остаток: ${p.stock}</span></div>
        <button class="del-btn" onclick="deleteProduct(${p.id})">Удалить</button>
      </div>
    `).join('');
  }

  async function deleteProduct(id) {
    if (!confirm('Удалить этот товар?')) return;
    const res = await fetch(`${API_URL}/api/admin/delete_product/${id}`, {
      method: 'DELETE',
      headers: {'x-token': adminToken}
    });
    if (res.ok) loadProductsAdmin();
  }

  async function loadMessages() {
    const res = await fetch(`${API_URL}/api/admin/messages`, { headers: {'x-token': adminToken} });
    const msgs = await res.json();
    const list = document.getElementById('messagesList');
    if (msgs.length === 0) {
      list.innerHTML = '<div style="color: #888;">Сообщений пока нет</div>';
      return;
    }
    list.innerHTML = msgs.map(m => `
      <div class="msg-card">
        <span class="msg-user">@${m.username}</span> <span class="msg-date">${m.date}</span>
        <div style="margin-top: 5px;">${m.text}</div>
      </div>
    `).join('');
  }

  // Звезды
  const canvas = document.getElementById('stars'), ctx = canvas.getContext('2d');
  let W, H, stars = [];
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  function initStars() { stars = Array.from({ length: 100 }, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, speed: Math.random()*0.3+0.05, alpha: Math.random()*0.6+0.4 })); }
  function draw() { ctx.clearRect(0,0,W,H); for (let s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255,255,255,${s.alpha})`; ctx.fill(); s.y -= s.speed; if (s.y < -2) { s.y = H+2; s.x = Math.random()*W; } } requestAnimationFrame(draw); }
  addEventListener('resize', () => { resize(); initStars(); }); resize(); initStars(); draw();
</script>
</body>
</html>

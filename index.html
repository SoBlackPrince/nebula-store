<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nebula Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; user-select: none; }
  #stars { position: fixed; inset: 0; z-index: 1; }
  #app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
  
  .header { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 20px; }
  .header-title { font-size: 24px; font-weight: 700; }
  .profile-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .profile-icon { width: 24px; height: 24px; fill: #fff; }

  /* Поиск */
  .search-section { display: flex; gap: 10px; margin-bottom: 15px; }
  .search-input { flex: 1; padding: 12px 16px; background: rgba(255,255,255,0.1); border: none; border-radius: 12px; color: #fff; outline: none; }
  
  /* Категории */
  .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
  .categories::-webkit-scrollbar { display: none; }
  .category-btn { padding: 8px 16px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
  .category-btn.active { background: #fff; color: #000; font-weight: 600; }

  /* Товары (Табличка) */
  .products { display: flex; flex-direction: column; gap: 10px; }
  .product-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.2s; }
  .product-card:active { background: rgba(255,255,255,0.1); }
  .product-info { flex: 1; }
  .product-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .product-category { font-size: 12px; color: #888; }
  .product-price { font-size: 16px; font-weight: 700; color: #fff; }

  /* Модалки (Профиль и Товар) */
  .modal-overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: #111; width: 90%; max-width: 360px; border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); transform: scale(0.9); transition: 0.3s; text-align: center; }
  .modal-overlay.active .modal { transform: scale(1); }
  
  .modal-avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; margin: 0 auto 15px; }
  .modal-avatar svg { width: 32px; height: 32px; fill: #fff; }
  .modal-nickname { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .modal-balance { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 25px; }
  .btn-primary { width: 100%; padding: 14px; background: #fff; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; }
  
  .product-desc { font-size: 14px; color: #ccc; margin: 15px 0; text-align: left; line-height: 1.5; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  <div class="header">
    <div class="header-title">Nebula Store</div>
    <div class="profile-btn" id="openProfile">
      <svg class="profile-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
    </div>
  </div>

  <div class="search-section">
    <input type="text" class="search-input" id="searchInput" placeholder="Поиск товара...">
  </div>

  <div class="categories" id="categories">
    <div class="category-btn active" data-cat="all">Все</div>
    <div class="category-btn" data-cat="Telegram Stars">Telegram Stars</div>
    <div class="category-btn" data-cat="Steam">Steam аккаунты</div>
    <div class="category-btn" data-cat="Roblox">Roblox аккаунты</div>
    <div class="category-btn" data-cat="Telegram">Telegram аккаунты</div>
  </div>

  <div class="products" id="productsList">
    <!-- Товары будут загружаться сюда -->
    <div style="text-align: center; color: #888; margin-top: 20px;">Загрузка товаров...</div>
  </div>
</div>

<!-- Окно профиля -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <div class="modal-avatar"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
    <div class="modal-nickname" id="userName">Загрузка...</div>
    <div class="modal-balance">Ваш баланс: <span id="userBalance">0</span> ₽</div>
    <button class="btn-primary" onclick="alert('Скоро добавим!')">Пополнить баланс</button>
  </div>
</div>

<!-- Окно товара -->
<div class="modal-overlay" id="productModal">
  <div class="modal">
    <div class="modal-nickname" id="mProductName">Имя товара</div>
    <div class="modal-balance" id="mProductCategory">Категория</div>
    <div class="product-desc" id="mProductDesc">Описание товара...</div>
    <div style="font-size: 22px; font-weight: 700; margin-bottom: 20px;" id="mProductPrice">0 ₽</div>
    <button class="btn-primary" style="background: #238636; color: #fff;" onclick="alert('Функция покупки в разработке')">Купить</button>
  </div>
</div>

<script>
  // ВАЖНО: Пока сервер не на хостинге, используем локальный адрес
  // Когда перенесем на Oracle Cloud, тут будет твой IP или домен
  const API_URL = "http://127.0.0.1:8000"; 

  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); }
  
  const user = tg?.initDataUnsafe?.user;
  document.getElementById('userName').innerText = user?.username ? `@${user.username}` : (user?.first_name || 'Гость');

  // Логика профиля
  const profileModal = document.getElementById('profileModal');
  document.getElementById('openProfile').onclick = () => profileModal.classList.add('active');
  profileModal.onclick = (e) => { if (e.target === profileModal) profileModal.classList.remove('active'); };

  // Загрузка товаров
  let allProducts = [];
  let currentCategory = 'all';
  let searchQuery = '';

  async function fetchProducts() {
    try {
      const res = await fetch(`${API_URL}/api/products`);
      allProducts = await res.json();
      renderProducts();
    } catch (e) {
      document.getElementById('productsList').innerHTML = '<div style="text-align: center; color: #ff4444;">Ошибка загрузки. Сервер выключен?</div>';
    }
  }

  function renderProducts() {
    const list = document.getElementById('productsList');
    list.innerHTML = '';
    
    const filtered = allProducts.filter(p => {
      const matchCat = currentCategory === 'all' || p.category === currentCategory;
      const matchSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      list.innerHTML = '<div style="text-align: center; color: #888; margin-top: 20px;">Товаров пока нет</div>';
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-category">${p.category}</div>
        </div>
        <div class="product-price">${p.price} ₽</div>
      `;
      card.onclick = () => openProductModal(p);
      list.appendChild(card);
    });
  }

  // Фильтры и поиск
  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      renderProducts();
    };
  });

  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value;
    renderProducts();
  };

  // Модалка товара
  const productModal = document.getElementById('productModal');
  function openProductModal(p) {
    document.getElementById('mProductName').innerText = p.name;
    document.getElementById('mProductCategory').innerText = p.category;
    document.getElementById('mProductDesc').innerText = p.description;
    document.getElementById('mProductPrice').innerText = p.price + ' ₽';
    productModal.classList.add('active');
  }
  productModal.onclick = (e) => { if (e.target === productModal) productModal.classList.remove('active'); };

  fetchProducts();

  // --- Звезды ---
  const canvas = document.getElementById('stars'), ctx = canvas.getContext('2d');
  let W, H, stars = [];
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  function initStars() { stars = Array.from({ length: 100 }, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, speed: Math.random()*0.3+0.05, alpha: Math.random()*0.6+0.4 })); }
  function draw() { ctx.clearRect(0,0,W,H); for (let s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255,255,255,${s.alpha})`; ctx.fill(); s.y -= s.speed; if (s.y < -2) { s.y = H+2; s.x = Math.random()*W; } } requestAnimationFrame(draw); }
  addEventListener('resize', () => { resize(); initStars(); }); resize(); initStars(); draw();
</script>
</body>
</html>

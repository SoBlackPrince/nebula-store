<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nebula Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; color: #fff; user-select: none; }
  #stars { position: fixed; inset: 0; z-index: 1; }
  
  /* Общий контейнер */
  #app { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; padding: 20px; overflow-y: auto; }
  
  /* Главная страница */
  #main-view { display: flex; flex-direction: column; height: 100%; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; margin-bottom: 20px; }
  .header-title { font-size: 24px; font-weight: 700; }
  .profile-btn { width: 42px; height: 42px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; cursor: pointer; }
  .profile-icon { width: 24px; height: 24px; fill: #fff; }
  .search-section { display: flex; gap: 10px; margin-bottom: 15px; }
  .search-input { flex: 1; padding: 12px 16px; background: rgba(255,255,255,0.1); border: none; border-radius: 12px; color: #fff; outline: none; }
  .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
  .categories::-webkit-scrollbar { display: none; }
  .category-btn { padding: 8px 16px; background: rgba(255,255,255,0.1); border-radius: 20px; font-size: 14px; white-space: nowrap; cursor: pointer; border: 1px solid transparent; }
  .category-btn.active { background: #fff; color: #000; font-weight: 600; }
  .products { display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
  .product-card { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
  .product-card:active { background: rgba(255,255,255,0.1); }
  .product-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .product-category { font-size: 12px; color: #888; }
  .product-price { font-size: 16px; font-weight: 700; }

  /* Страница товара (скрыта по умолчанию) */
  #product-view { display: none; flex-direction: column; height: 100%; animation: slideIn 0.3s ease; }
  .back-btn { display: flex; align-items: center; gap: 5px; background: none; border: none; color: #fff; font-size: 16px; cursor: pointer; margin-bottom: 20px; padding: 0; }
  .p-title { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
  .p-cat-badge { display: inline-block; padding: 5px 10px; background: rgba(255,255,255,0.1); border-radius: 10px; font-size: 12px; margin-bottom: 20px; }
  .p-desc-box { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; line-height: 1.5; color: #ccc; font-size: 15px; flex: 1; overflow-y: auto; }
  .p-bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .p-price { font-size: 28px; font-weight: 700; }
  .p-qty { display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.1); padding: 5px 15px; border-radius: 15px; }
  .p-qty button { background: none; border: none; color: #fff; font-size: 20px; font-weight: bold; cursor: pointer; }
  .p-qty span { font-size: 18px; font-weight: 600; }
  .btn-buy { width: 100%; padding: 16px; background: #fff; color: #000; border: none; border-radius: 15px; font-size: 18px; font-weight: 700; cursor: pointer; }

  @keyframes slideIn { from { opacity: 0; transform: translateX(50px); } to { opacity: 1; transform: translateX(0); } }

  /* Модалка профиля */
  .modal-overlay { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: 0.3s; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: #111; width: 90%; max-width: 360px; border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); transform: scale(0.9); transition: 0.3s; text-align: center; }
  .modal-overlay.active .modal { transform: scale(1); }
  .modal-avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.1); display: flex; justify-content: center; align-items: center; margin: 0 auto 15px; }
  .modal-avatar svg { width: 32px; height: 32px; fill: #fff; }
  .modal-nickname { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
  .modal-balance { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 25px; }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div id="app">
  
  <!-- ГЛАВНАЯ СТРАНИЦА -->
  <div id="main-view">
    <div class="header">
      <div class="header-title">Nebula Store</div>
      <div class="profile-btn" id="openProfile">
        <svg class="profile-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
      </div>
    </div>

    <div class="search-section">
      <input type="text" class="search-input" id="searchInput" placeholder="Поиск по названию или описанию...">
    </div>

    <div class="categories" id="categories">
      <div class="category-btn active" data-cat="all">Все</div>
      <div class="category-btn" data-cat="Telegram Stars">Telegram Stars</div>
      <div class="category-btn" data-cat="Steam">Steam</div>
      <div class="category-btn" data-cat="Roblox">Roblox</div>
      <div class="category-btn" data-cat="Telegram">Telegram</div>
    </div>

    <div class="products" id="productsList">
      <div style="text-align: center; color: #888; margin-top: 20px;">Загрузка товаров...</div>
    </div>
  </div>

  <!-- СТРАНИЦА ТОВАРА -->
  <div id="product-view">
    <button class="back-btn" onclick="closeProduct()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Назад
    </button>
    <div class="p-title" id="vpTitle">Название</div>
    <div class="p-cat-badge" id="vpCat">Категория</div>
    
    <div class="p-desc-box" id="vpDesc">
      Описание товара...
    </div>
    
    <div class="p-bottom-bar">
      <div class="p-price" id="vpPrice">0 ₽</div>
      <div class="p-qty">
        <button onclick="changeQty(-1)">-</button>
        <span id="vpQty">1</span>
        <button onclick="changeQty(1)">+</button>
      </div>
    </div>
    
    <button class="btn-buy" onclick="buyProduct()">Купить</button>
  </div>

</div>

<!-- Окно профиля -->
<div class="modal-overlay" id="profileModal">
  <div class="modal">
    <div class="modal-avatar"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
    <div class="modal-nickname" id="userName">Загрузка...</div>
    <div class="modal-balance">Ваш баланс: <span id="userBalance">0</span> ₽</div>
    <button class="btn-buy" onclick="alert('Скоро добавим!')">Пополнить баланс</button>
  </div>
</div>

<script>
  // ВСТАВЬ СЮДА ССЫЛКУ ОТ NGROK (если тестируешь с GitHub)
  const API_URL = "http://127.0.0.1:8000"; 

  const tg = window.Telegram?.WebApp;
  if (tg) { 
    tg.ready(); 
    tg.expand(); 
    tg.setHeaderColor('#000000'); 
    tg.setBackgroundColor('#000000');
    // Разворачиваем на весь экран (если поддерживается)
    if (tg.requestFullscreen) { tg.requestFullscreen(); }
  }
  
  const user = tg?.initDataUnsafe?.user;
  document.getElementById('userName').innerText = user?.username ? `@${user.username}` : (user?.first_name || 'Гость');

  const profileModal = document.getElementById('profileModal');
  document.getElementById('openProfile').onclick = () => profileModal.classList.add('active');
  profileModal.onclick = (e) => { if (e.target === profileModal) profileModal.classList.remove('active'); };

  // --- ЛОГИКА МАГАЗИНА ---
  let allProducts = [];
  let currentCategory = 'all';
  let searchQuery = '';
  
  // Переменные для страницы товара
  let currentProduct = null;
  let currentQty = 1;

  async function fetchProducts() {
    try {
      const res = await fetch(`${API_URL}/api/products`);
      allProducts = await res.json();
      renderProducts();
    } catch (e) {
      document.getElementById('productsList').innerHTML = '<div style="text-align: center; color: #ff4444;">Ошибка загрузки. Сервер выключен?</div>';
    }
  }

  function renderProducts() {
    const list = document.getElementById('productsList');
    list.innerHTML = '';
    
    // Умный поиск (по имени и описанию)
    const query = searchQuery.toLowerCase().trim();
    const filtered = allProducts.filter(p => {
      const matchCat = currentCategory === 'all' || p.category === currentCategory;
      const matchSearch = p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query);
      return matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      list.innerHTML = '<div style="text-align: center; color: #888; margin-top: 20px;">Ничего не найдено</div>';
      return;
    }

    filtered.forEach(p => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div>
          <div class="product-name">${p.name}</div>
          <div class="product-category">${p.category} | В наличии: ${p.stock}</div>
        </div>
        <div class="product-price">${p.price} ₽</div>
      `;
      card.onclick = () => openProductPage(p);
      list.appendChild(card);
    });
  }

  document.querySelectorAll('.category-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentCategory = btn.dataset.cat;
      renderProducts();
    };
  });

  document.getElementById('searchInput').oninput = (e) => {
    searchQuery = e.target.value;
    renderProducts();
  };

  // --- ПЕРЕХОД НА СТРАНИЦУ ТОВАРА ---
  function openProductPage(p) {
    currentProduct = p;
    currentQty = 1;
    
    document.getElementById('vpTitle').innerText = p.name;
    document.getElementById('vpCat').innerText = p.category;
    document.getElementById('vpDesc').innerText = p.description;
    document.getElementById('vpPrice').innerText = p.price + ' ₽';
    document.getElementById('vpQty').innerText = currentQty;
    
    document.getElementById('main-view').style.display = 'none';
    document.getElementById('product-view').style.display = 'flex';
    
    if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  }

  function closeProduct() {
    document.getElementById('product-view').style.display = 'none';
    document.getElementById('main-view').style.display = 'flex';
  }

  function changeQty(delta) {
    if (!currentProduct) return;
    let newQty = currentQty + delta;
    if (newQty < 1) newQty = 1;
    if (newQty > currentProduct.stock) {
      if (tg) tg.showAlert('Больше нет в наличии!');
      else alert('Больше нет в наличии!');
      return;
    }
    currentQty = newQty;
    document.getElementById('vpQty').innerText = currentQty;
  }

  function buyProduct() {
    if (!currentProduct) return;
    if (currentProduct.stock === 0) return alert('Нет в наличии');
    
    // Тут будет логика покупки
    if (tg) tg.showAlert(`Вы хотите купить ${currentProduct.name} в количестве ${currentQty} шт. за ${currentProduct.price * currentQty} ₽. Функция оплаты в разработке.`);
    else alert(`Покупка: ${currentProduct.name} x${currentQty}`);
  }

  fetchProducts();

  // Звезды
  const canvas = document.getElementById('stars'), ctx = canvas.getContext('2d');
  let W, H, stars = [];
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  function initStars() { stars = Array.from({ length: 100 }, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.5+0.3, speed: Math.random()*0.3+0.05, alpha: Math.random()*0.6+0.4 })); }
  function draw() { ctx.clearRect(0,0,W,H); for (let s of stars) { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255,255,255,${s.alpha})`; ctx.fill(); s.y -= s.speed; if (s.y < -2) { s.y = H+2; s.x = Math.random()*W; } } requestAnimationFrame(draw); }
  addEventListener('resize', () => { resize(); initStars(); }); resize(); initStars(); draw();
</script>
</body>
</html>
